# Build and deploy the Astro site to GitHub Pages.
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy Astro site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # package.json engines require Node >=22.12.0. Astro 7 will not build on Node 20.
          node-version: '22'
          # packageManager is "pnpm" with no version, so pin the major that understands allowBuilds.
          package-manager: pnpm@10

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
